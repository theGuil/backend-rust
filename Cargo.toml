[package]
name = "backend-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4.39"
uuid = { version = "1.0", features = ["v4"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "mysql"] }
dotenv = "0.15"
once_cell = "1.20.2"
bcrypt = "0.16.0"
jsonwebtoken = "9.1"
tower-http = { version = "0.5", features = ["cors"] }
validator = "0.19.0"
